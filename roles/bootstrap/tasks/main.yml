# main tasks file for bootstrap
- name: Install packages
  ansible.builtin.include_tasks:
    file: pkg.yml

- name: Set up shell
  ansible.builtin.include_tasks:
    file: shell.yml

- name: Set up Emacs
  ansible.builtin.include_tasks:
    file: emacs.yml

- name: Set up Perl
  ansible.builtin.include_tasks:
    file: perl.yml

- name: Set up personal bin directory and scripts
  ansible.builtin.include_tasks:
    file: bin.yml
